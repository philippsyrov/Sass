name: macOS tests

on:
  push:
    branches: [codex/graceful-terminal-shutdown]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm ci
      - name: Install shell verifier
        run: command -v shellcheck || brew install shellcheck
      - name: Verify
        run: npm run verify
      - name: Full test suite
        env:
          SASS_DISPOSABLE_MAC_RUNNER: '1'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.test.mjs
